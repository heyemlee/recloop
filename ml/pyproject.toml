[project]
name = "recloop-ml"
version = "0.1.0"
description = "RecLoop offline side: data preparation, baselines and evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.9",
    "fire>=0.7",              # MiniOneRec's calc.py
    "numpy>=2.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "redis>=5.2",
    "scipy>=1.14",
    "sentence-transformers>=3.3",
    "torch>=2.5",             # imported (unused) by MiniOneRec's amazon18_data_process.py; SASRec in M1
    "tqdm>=4.66",
    "xxhash>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# Not an installable package: modules run from the repo root as `python -m ml.<pkg>.<module>`.
package = false

[tool.pytest.ini_options]
# rootdir is ml/; ".." puts the repo root on sys.path so `import ml...` works.
pythonpath = [".."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
# `ruff format` wraps code at line-length; what it cannot wrap (SHA-256 literals, long
# strings) is left alone rather than flagged.
ignore = ["E501"]

[tool.ruff.lint.isort]
# The repo-level packages that run in this environment (sim/, analysis/, loadtest/, kube/).
known-first-party = ["ml", "sim", "analysis", "loadtest", "kube"]
